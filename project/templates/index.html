<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户系统</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>用户认证系统</h1>

    <div class="card">
        <h2>注册</h2>

        <input type="text" id="register-username" placeholder="用户名">
        <input type="email" id="register-email" placeholder="邮箱">
        <input type="password" id="register-password" placeholder="密码">

        <button onclick="register()">注册</button>

        <div id="register-result"></div>
    </div>

    <div class="card">
        <h2>登录</h2>

        <input type="email" id="login-email" placeholder="邮箱">
        <input type="password" id="login-password" placeholder="密码">

        <button onclick="login()">登录</button>

        <div id="login-result"></div>
    </div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
